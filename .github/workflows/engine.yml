name: engine

# Typecheck and test the spec-first market engine under engine/. It is a
# separate package with its own lockfile; the legacy app's eval workflow
# does not cover it.

on:
  pull_request:
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'
  push:
    branches:
      - main
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: engine/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
